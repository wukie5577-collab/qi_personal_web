<!doctype html>
<html lang="en">
  <head>
    <title>XR Subliminal Spheres | Motion Aftereffect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.11.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.11.0/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      /**
       * 潜意识运动后效 (Motion Aftereffect) 诱导应用
       * 小球在视野内产生持续的定向流动，诱发视觉适应性以对抗晕动症
       */
      class SubliminalSymphony extends xb.Script {
        constructor() {
          super();
          this.whiteSpheres = [];
          this.blackSpheres = [];
          
          // 存储每一个小球在视野内的动态局部坐标
          this.whiteOffsets = [];
          this.blackOffsets = [];
          
          this.lastCameraPos = new THREE.Vector3();
          // 新增：记录上一帧相机的旋转，用于手机陀螺仪测试
          this.lastCameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');
          
          this.velocity = new THREE.Vector3();
          
          this.globalFrameCounter = 0;
          this.totalPerGroup = 50;
          this.isEnabled = false; 

          // 核心控制变量：漂移乘数 (Drift Multiplier)
          // = 0: 锁定头部（不滑动）
          // = -1: 锁定世界（和真实世界一起反向滑动）
          // > 0: 主动流动（产生运动后效）。比如 1.5 表示以头部移动速度的 1.5 倍在视野内同向滑动
          this.driftMultiplier = 1.5; 
          this.intensityText = null;
          
          // 新增：调试模式状态
          this.isDebugMode = false;
        }

        init() {
          this.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
          this.createControlUI();

          // 保持极小尺寸与极低透明度
          const geometry = new THREE.SphereGeometry(0.0005, 4, 4); 
          
          // 将材质保存为类属性，以便后续动态修改透明度
          this.whiteMat = new THREE.MeshBasicMaterial({ 
            color: 0xcccccc, 
            transparent: true, 
            opacity: 0.15 
          });
          this.blackMat = new THREE.MeshBasicMaterial({ 
            color: 0x333333, 
            transparent: true, 
            opacity: 0.15 
          });

          for (let i = 0; i < this.totalPerGroup; i++) {
            const ws = new THREE.Mesh(geometry, this.whiteMat);
            const bs = new THREE.Mesh(geometry, this.blackMat);
            ws.visible = bs.visible = false;
            this.add(ws);
            this.add(bs);
            this.whiteSpheres.push(ws);
            this.blackSpheres.push(bs);

            // 初始化局部坐标
            this.whiteOffsets.push(new THREE.Vector3(
              (Math.random() - 0.5) * 3.0, // x 范围 -1.5 到 1.5
              (Math.random() - 0.5) * 2.0, // y 范围 -1.0 到 1.0
              -0.5 - (Math.random() * 1.5) // z 深度
            ));
            
            this.blackOffsets.push(new THREE.Vector3(
              (Math.random() - 0.5) * 3.0,
              (Math.random() - 0.5) * 2.0,
              -0.5 - (Math.random() * 1.5)
            ));
          }

          this.lastCameraPos.copy(xb.core.camera.position);
          this.lastCameraEuler.setFromQuaternion(xb.core.camera.quaternion);
        }

        createControlUI() {
          const panel = new xb.SpatialPanel({
            width: 2.0, // 再次大幅增加面板宽度到 2.0 米 (巨型看板)
            height: 2.0, // 再次大幅增加面板高度到 2.0 米
            backgroundColor: '#000000dd', // 加深背景颜色，增强文字的对比度
          });
          panel.position.set(0, 1.5, -2.0); // 往后放一点到 -2.0 米，防止太大贴脸
          this.add(panel);

          const grid = panel.addGrid();
          grid.addRow({weight: 0.2}).addText({
            text: 'Motion Aftereffect 诱导',
            fontSize: 0.15, // 字体放大近两倍 (15厘米高的巨型字)
            fontColor: '#ffffff'
          });

          // 开关控制行
          const btnRow = grid.addRow({weight: 0.3});
          this.toggleBtn = btnRow.addTextButton({
            text: '错觉诱导: 关',
            backgroundColor: '#ff4444',
            fontSize: 0.15 // 按钮字体放大近两倍
          });

          this.toggleBtn.onTriggered = () => {
            this.isEnabled = !this.isEnabled;
            this.toggleBtn.setText(this.isEnabled ? '错觉诱导: 开' : '错觉诱导: 关');
            try {
              this.toggleBtn.backgroundColor = this.isEnabled ? '#44ff44' : '#ff4444';
            } catch (e) {}
            if (!this.isEnabled) this.setAllVisibility(false);
          };

          // 运动强度调节行
          const intensityRow = grid.addRow({weight: 0.3});
          
          const minusBtn = intensityRow.addCol({weight: 0.25}).addIconButton({
            text: 'remove', 
            fontSize: 0.8 // 放大加减图标
          });
          minusBtn.onTriggered = () => this.adjustIntensity(-0.1);

          this.intensityText = intensityRow.addCol({weight: 0.5}).addText({
            text: `运动倍率: ${this.driftMultiplier.toFixed(1)}x`,
            fontSize: 0.12, // 放大状态文本
            fontColor: '#4ecdc4'
          });

          const plusBtn = intensityRow.addCol({weight: 0.25}).addIconButton({
            text: 'add', 
            fontSize: 0.8 // 放大加减图标
          });
          plusBtn.onTriggered = () => this.adjustIntensity(0.1);

          // 新增：可见性调试行
          const debugRow = grid.addRow({weight: 0.2});
          this.debugBtn = debugRow.addTextButton({
            text: '可见性调试: 关',
            backgroundColor: '#888888',
            fontSize: 0.12 // 调试按钮也放大
          });

          this.debugBtn.onTriggered = () => {
            this.isDebugMode = !this.isDebugMode;
            this.debugBtn.setText(this.isDebugMode ? '可见性调试: 开' : '可见性调试: 关');
            
            try {
              this.debugBtn.backgroundColor = this.isDebugMode ? '#aaaa00' : '#888888';
            } catch (e) {}

            // 切换材质透明度
            this.whiteMat.opacity = this.isDebugMode ? 1.0 : 0.15;
            this.blackMat.opacity = this.isDebugMode ? 1.0 : 0.15;

            // 切换小球缩放比例 (0.0005 * 20 = 0.01 即 1厘米大小)
            const scale = this.isDebugMode ? 20.0 : 1.0;
            for (let i = 0; i < this.totalPerGroup; i++) {
              this.whiteSpheres[i].scale.setScalar(scale);
              this.blackSpheres[i].scale.setScalar(scale);
            }
          };
        }

        adjustIntensity(delta) {
          this.driftMultiplier += delta;
          // 限制强度范围在 -5.0 到 5.0 之间，避免数值溢出导致眩晕加剧
          this.driftMultiplier = Math.max(-5.0, Math.min(5.0, this.driftMultiplier));
          if (this.intensityText) {
            this.intensityText.setText(`运动倍率: ${this.driftMultiplier.toFixed(1)}x`);
          }
        }

        setAllVisibility(visible) {
          for (let i = 0; i < this.totalPerGroup; i++) {
            this.whiteSpheres[i].visible = visible;
            this.blackSpheres[i].visible = visible;
          }
        }

        update() {
          const camera = xb.core.camera;
          const currentPos = new THREE.Vector3();
          camera.getWorldPosition(currentPos);
          
          const currentEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');

          // 1. 获取相机当前帧的移动矢量 (世界坐标系)
          this.velocity.subVectors(currentPos, this.lastCameraPos);
          
          // 2. 将世界坐标系的平移矢量转换到相机的局部坐标系
          // 这能让我们知道相对于人的视角，是向左、右、上、下还是前、后移动
          const localVelocity = this.velocity.clone().applyQuaternion(camera.quaternion.clone().invert());
          
          // 3. 计算旋转变化 (偏航角 Yaw 和 俯仰角 Pitch)
          let yawDelta = currentEuler.y - this.lastCameraEuler.y;
          let pitchDelta = currentEuler.x - this.lastCameraEuler.x;
          
          // 处理 180 度翻转的边缘情况
          if (yawDelta > Math.PI) yawDelta -= Math.PI * 2;
          if (yawDelta < -Math.PI) yawDelta += Math.PI * 2;
          if (pitchDelta > Math.PI) pitchDelta -= Math.PI * 2;
          if (pitchDelta < -Math.PI) pitchDelta += Math.PI * 2;
          
          // 将角速度粗略映射为线速度 (假设视觉参考半径为 1 米)
          // Yaw 左转 (正值) 相当于视觉上向右移动
          const rotationVelocityX = -yawDelta; 
          // Pitch 抬头 (正值) 相当于视觉上向下移动
          const rotationVelocityY = pitchDelta; 

          // 4. 综合平移和旋转，计算三个轴向的总用户运动矢量 (X, Y, Z)
          const totalFlowX = localVelocity.x + rotationVelocityX;
          const totalFlowY = localVelocity.y + rotationVelocityY;
          const totalFlowZ = localVelocity.z; // 前后移动通常只计算平移

          // 计算运动的标量大小，只要任何方向有运动，就判定为正在移动
          const movementMagnitude = Math.sqrt(totalFlowX**2 + totalFlowY**2 + totalFlowZ**2);
          const isMoving = movementMagnitude > 0.0005;

          this.globalFrameCounter++;
          const cycleFrame = this.globalFrameCounter % 3;

          if (this.isEnabled && isMoving) {
            
            // 核心逻辑：在 X, Y, Z 三个维度上产生相对滑动 (全方位 Optic Flow)
            const driftX = totalFlowX * this.driftMultiplier;
            const driftY = totalFlowY * this.driftMultiplier;
            const driftZ = totalFlowZ * this.driftMultiplier;

            for (let i = 0; i < this.totalPerGroup; i++) {
              // --- 更新白球的局部 3D 坐标 ---
              this.whiteOffsets[i].x += driftX;
              this.whiteOffsets[i].y += driftY;
              this.whiteOffsets[i].z += driftZ;

              // 三维包裹逻辑 (3D Wrap-around)
              // X 轴 (左右): -1.5 到 1.5 (宽度 3.0)
              if (this.whiteOffsets[i].x < -1.5) this.whiteOffsets[i].x += 3.0;
              if (this.whiteOffsets[i].x > 1.5) this.whiteOffsets[i].x -= 3.0;
              // Y 轴 (上下): -1.0 到 1.0 (高度 2.0)
              if (this.whiteOffsets[i].y < -1.0) this.whiteOffsets[i].y += 2.0;
              if (this.whiteOffsets[i].y > 1.0) this.whiteOffsets[i].y -= 2.0;
              // Z 轴 (前后深度): -2.0 到 -0.5 (深度 1.5)
              if (this.whiteOffsets[i].z < -2.0) this.whiteOffsets[i].z += 1.5;
              if (this.whiteOffsets[i].z > -0.5) this.whiteOffsets[i].z -= 1.5;

              // --- 更新黑球的局部 3D 坐标 ---
              this.blackOffsets[i].x += driftX;
              this.blackOffsets[i].y += driftY;
              this.blackOffsets[i].z += driftZ;

              if (this.blackOffsets[i].x < -1.5) this.blackOffsets[i].x += 3.0;
              if (this.blackOffsets[i].x > 1.5) this.blackOffsets[i].x -= 3.0;
              if (this.blackOffsets[i].y < -1.0) this.blackOffsets[i].y += 2.0;
              if (this.blackOffsets[i].y > 1.0) this.blackOffsets[i].y -= 2.0;
              if (this.blackOffsets[i].z < -2.0) this.blackOffsets[i].z += 1.5;
              if (this.blackOffsets[i].z > -0.5) this.blackOffsets[i].z -= 1.5;
            }

            // 严格执行 3 帧中显示 1 帧的采样率
            if (cycleFrame === 0) {
              for (let i = 0; i < this.totalPerGroup; i++) {
                // 将局部动态坐标转换为世界坐标并显示
                const wPos = this.whiteOffsets[i].clone().applyQuaternion(camera.quaternion).add(currentPos);
                this.whiteSpheres[i].position.copy(wPos);
                this.whiteSpheres[i].visible = true;

                const bPos = this.blackOffsets[i].clone().applyQuaternion(camera.quaternion).add(currentPos);
                this.blackSpheres[i].position.copy(bPos);
                this.blackSpheres[i].visible = true;
              }
            } else {
              this.setAllVisibility(false);
            }

          } else {
            // 未移动或处于关闭状态时，完全隐藏
            this.setAllVisibility(false);
          }

          this.lastCameraPos.copy(currentPos);
          this.lastCameraEuler.copy(currentEuler);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.enableUI(); 
        options.setAppTitle('MAE Cybersickness Countermeasure');
        
        xb.add(new SubliminalSymphony());
        xb.init(options);
      });
    </script>
  </body>
</html>
